{% extends 'base.html' %}

{% block header %}
    <h1 class= 'mx-auto text-center'>{% block title %}Emergencies{% endblock %}</h1>
    <link rel="stylesheet" href="../static/style.css">

{% endblock %}

{% block content %}
    <div class="search-container">
        <div class="search-wrapper">
            <input
                type="text"
                id="emergency-search"
                class="search-input"
                placeholder="Search emergencies..."
                autocomplete="off"
            >
            <span class="search-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <path d="m21 21-4.35-4.35"></path>
                </svg>
            </span>
        </div>
        <p id="search-results-count" class="search-results-count"></p>
    </div>

{% if emergency %}
    <div class="grid-container">

        {% for e in emergency %}

        <a class="a-div emergency-card" href="{{ url_for('emergency.specific_emergency', e_id = e.id) }}"
           data-name="{{ e.name|lower }}"
           data-description="{{ e.description|lower if e.description else '' }}">
            <div class="inner-grid-container">

                <div>
                    <h1>{{ e.name }}</h1><br>
                    <h2>{{ e.date }}</h2>
                </div>

                <div style="text-align: center">
                    <img src="{{ e.img_url }}"><br>
                </div>

            </div>
        </a>
        {% endfor %}

    </div>
{% else %}
    <p class="my-3 mx-auto no-emergencies-message">No emergencies found.</p>
{% endif %}

<script>
document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('emergency-search');
    const resultsCount = document.getElementById('search-results-count');
    const cards = document.querySelectorAll('.emergency-card');
    const noEmergenciesMsg = document.querySelector('.no-emergencies-message');

    if (!searchInput || cards.length === 0) return;

    searchInput.addEventListener('input', function() {
        const query = this.value.toLowerCase().trim();
        let visibleCount = 0;

        cards.forEach(function(card) {
            const name = card.dataset.name || '';
            const description = card.dataset.description || '';
            const matches = name.includes(query) || description.includes(query);

            if (matches) {
                card.style.display = '';
                visibleCount++;
            } else {
                card.style.display = 'none';
            }
        });

        if (query) {
            resultsCount.textContent = visibleCount + ' result' + (visibleCount !== 1 ? 's' : '') + ' found';
        } else {
            resultsCount.textContent = '';
        }
    });
});
</script>
{% endblock %}
