{% extends 'base.html' %}

{% block header %}
    <h1 class= 'mx-auto text-center p-5'>{% block title %}Emergencies{% endblock %}</h1>
    <link rel="stylesheet" href="../static/style.css">

{% endblock %}

{% block content %}

<div class="grid-container">

    {% for e in emergency %}

    <a class="a-div" href="">
        <div class= "inner-grid-container">

            <div>
                <h1> {{ e.emergency_name }} </h1><br>
                <h2> {{ e.emergency_date }} </h2>
            </div>

            <div style= "text-align: center" >
                <img src = {{ e.image_url}}><br>

            </div>
            
        </div>
    </a>
    {% endfor %}

</div>
{% endblock %}
