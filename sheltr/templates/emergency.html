{% extends 'base.html' %}

{% block header %}
    <h1 class= 'mx-auto text-center p-5'>{% block title %}Emergencies{% endblock %}</h1>
    <link rel="stylesheet" href="../static/style.css">

{% endblock %}

{% block content %}

<div class="grid-container">

    {% for e in emergency %}

    <a class="a-div" href="{{ url_for('emergency.specific_emergency', e_id = e.id) }}">
        <div class= "inner-grid-container">

            <div>
                <h1> {{ e.name }} </h1><br>
                <h2> {{ e.date }} </h2>
            </div>

            <div style= "text-align: center" >
                <img src = {{ e.img_url}}><br>

            </div>

        </div>
    </a>
    {% endfor %}

</div>
{% endblock %}
