{% extends 'base.html' %}

{% block header %}
  <h1 class="mx-auto text-center">{% block title %}Edit Task{% endblock %}</h1>
{% endblock %}

{% block content %}
<div class="container mt-4">
    <div class="card">
        <div class="card-header">
            <h3>Edit Information for Task {{ task.id }}</h3>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mb-3">
                    <label for="name" class="form-label">Name *</label>
                    <input type="text" class="form-control" id="name" name="name"
                           value="{{ task.name }}" maxlength="50" required>
                    <div class="form-text">Maximum 50 characters</div>
                </div>

                <div class="mb-3">
                    <label for="description" class="form-label">Description *</label>
                    <textarea class="form-control" name="description" id="description"
                              rows="4" maxlength="1000" required>{{ task.description }}</textarea>
                    <div class="form-text">Maximum 1000 characters</div>
                </div>
                
                <div class="mb-3">
                    <label for="volunteer" class="form-label">Assigned Volunteer</label>
                    <select class="form-select" name="volunteer" id="volunteer">
                        <option value="-1">None</option>
                        {% for volunteer in volunteers %}
                            <option value="{{ volunteer.id }}">{{ volunteer.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin.shelter', shelter_id=shelter_id) }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
