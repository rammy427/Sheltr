{% extends 'base.html' %}

{% block header %}
    <h1 class="mx-auto text-center">{% block title %}View Shelters{% endblock %}</h1>
{% endblock %}

{% block content %}
    <div class="container mx-auto text-center">
        <div class="row">
            <div class="col">
                <table class="table">
                    <thead>
                        <tr>
                            <th scope="col">Name</th>
                            <th scope="col">Location</th>
                            <th scope="col">Description</th>
                            <th scope="col">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for shelter in shelters %}
                            <tr>
                                <td class="col-1">{{ shelter.name }}</td>
                                <td class="col-1">{{ shelter.location }}</td>
                                <td class="col-1">{{ shelter.description }}</td>
                                <td class="col-1">
                                    <a href="{{ url_for('shelters.shelter', shelter_id=shelter.id) }}" class="btn btn-primary">Volunteer</a>
                                </td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
{% endblock %}
