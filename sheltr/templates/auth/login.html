{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <h2>Welcome Back</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Sign in to your Sheltr account</p>
        <form method="post" class="auth-form">
            <div class="auth-field">
                <label for="username">Username</label>
                <input name="username" id="username" required autofocus placeholder="Enter your username">
            </div>
            <div class="auth-field">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" required placeholder="Enter your password">
            </div>
            <div class="auth-actions">
                <button type="submit" class="btn-primary" style="width: 100%;">Sign In</button>
                <div class="link-row">
                    <a href="{{ url_for('auth.forgot_password') }}">Forgot password?</a>
                    <a href="{{ url_for('auth.register') }}">Create account</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
