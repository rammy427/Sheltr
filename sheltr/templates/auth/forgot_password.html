{% extends 'base.html' %}

{% block title %}Forgot Password{% endblock %}

{% block header %}{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div style="text-align: center; margin-bottom: 1.5rem;">
            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="color: #667eea;">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
        </div>
        <h2>Forgot Password</h2>
        <p style="color: #64748b; margin-bottom: 1.5rem;">Enter your username or email to reset your password</p>
        <form method="post" class="auth-form">
            <div class="auth-field">
                <label for="identifier">Username or Email</label>
                <input name="identifier" id="identifier" required autofocus placeholder="Enter your username or email">
            </div>
            <div class="auth-actions">
                <button type="submit" class="btn-primary" style="width: 100%;">Send Reset Link</button>
                <div class="link-row">
                    <a href="{{ url_for('auth.login') }}">Back to login</a>
                    <a href="{{ url_for('auth.register') }}">Create account</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
