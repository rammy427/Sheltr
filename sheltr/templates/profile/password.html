{% extends 'base.html' %}

{% block title %}Change Password{% endblock %}

{% block header %}
    <h1 class="text-center">Change Password</h1>
{% endblock %}

{% block content %}
<div class="container" style="max-width: 600px; margin: 0 auto;">
    <div class="card">
        <div class="card-header">
            <h3 style="display: flex; align-items: center; gap: 10px; margin: 0;">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: #667eea;">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                </svg>
                Update Your Password
            </h3>
        </div>
        <div class="card-body">
            <form method="post">
                <div class="mb-4">
                    <label for="current_password" class="form-label" style="font-weight: 600; color: #334155;">Current Password *</label>
                    <input type="password" class="form-control" id="current_password"
                           name="current_password" required placeholder="Enter your current password">
                </div>

                <div class="mb-4">
                    <label for="new_password" class="form-label" style="font-weight: 600; color: #334155;">New Password *</label>
                    <input type="password" class="form-control" id="new_password"
                           name="new_password" minlength="8" required placeholder="Create a new password"
                           title="Must be at least 8 characters with 1 uppercase, 1 number, and 1 special character">
                    <div class="form-text" style="color: #94a3b8;">
                        Must be at least 8 characters with 1 uppercase letter, 1 number, and 1 special character
                    </div>
                </div>

                <div class="mb-4">
                    <label for="confirm_password" class="form-label" style="font-weight: 600; color: #334155;">Confirm New Password *</label>
                    <input type="password" class="form-control" id="confirm_password"
                           name="confirm_password" required placeholder="Confirm your new password">
                </div>

                <div class="d-flex gap-2 flex-wrap">
                    <button type="submit" class="btn btn-warning">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right: 6px;">
                            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                        </svg>
                        Change Password
                    </button>
                    <a href="{{ url_for('profile.view') }}" class="btn btn-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
